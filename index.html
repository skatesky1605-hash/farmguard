    // ==========================================
    // 4. RULE-BASED IRRIGATION DECISION ENGINE
    // ==========================================
    const calculateIrrigationDecision = ({
      soilMoisture = 30,
      recentRain = 0,
      forecastRain = 0,
      cropName = "Rice",
      growthStage = "Vegetative",
      temperature = 28
    }) => {
      let targetMoisture = 35;
      const lowerCrop = cropName.toLowerCase();
      
      if (lowerCrop.includes("rice")) targetMoisture = 45;
      else if (lowerCrop.includes("tomato")) targetMoisture = 32;
      else if (lowerCrop.includes("maize") || lowerCrop.includes("corn")) targetMoisture = 28;
      else if (lowerCrop.includes("wheat")) targetMoisture = 26;
      else if (lowerCrop.includes("potato") || lowerCrop.includes("onion")) targetMoisture = 30;

      // Stage adjustment
      if (growthStage.toLowerCase().includes("flowering") || growthStage.toLowerCase().includes("yield")) {
        targetMoisture += 5;
      }

      const factors = [
        { label: "Current Soil Moisture", value: `${soilMoisture}%`, status: soilMoisture < targetMoisture ? "Low" : "Optimal" },
        { label: "24h Rain Forecast", value: `${forecastRain} mm`, status: forecastRain > 8 ? "Heavy Rain Expected" : "Minimal Rain" },
        { label: "Recent Rain (24h)", value: `${recentRain} mm` },
        { label: "Crop Target Moisture", value: `${targetMoisture}%` },
        { label: "Ambient Temperature", value: `${temperature}°C` }
      ];

      // Decision rules
      if (forecastRain >= 12) {
        return {
          status: "DELAY IRRIGATION",
          color: "bg-amber-100 text-amber-800 border-amber-300",
          icon: "cloud-rain",
          reason: `Rain forecast predicts ${forecastRain} mm of rainfall in the next 24 hours. Natural precipitation will adequately recharge soil moisture.`,
          factors
        };
      }

      if (soilMoisture < (targetMoisture - 5) && forecastRain < 5) {
        return {
          status: "IRRIGATION REQUIRED",
          color: "bg-emerald-100 text-emerald-800 border-emerald-300",
          icon: "droplets",
          reason: `Current soil moisture (${soilMoisture}%) is below the target threshold of ${targetMoisture}% for ${cropName} (${growthStage} stage), with negligible rainfall expected.`,
          factors
        };
      }

      if (soilMoisture >= targetMoisture + 8) {
        return {
          status: "NO IRRIGATION REQUIRED",
          color: "bg-blue-100 text-blue-800 border-blue-300",
          icon: "check-circle-2",
          reason: `Soil moisture (${soilMoisture}%) is at an optimal level above the ${targetMoisture}% requirement for ${cropName}.`,
          factors
        };
      }

      return {
        status: "MONITOR",
        color: "bg-sky-100 text-sky-800 border-sky-300",
        icon: "eye",
        reason: `Soil moisture (${soilMoisture}%) is near the threshold of ${targetMoisture}%. Monitor moisture levels over the next 12 hours before watering.`,

      };
    };

    const AnalyticsView = ({ userId, crops }) => {
      const [financials, setFinancials] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [recData, setRecData] = useState({
        type: "expense",
        category: "Seeds",
        amount: "5000",
        cropId: crops[0]?.id || "",
        date: new Date().toISOString().split('T')[0]
      });

      useEffect(() => {
        setFinancials(db.getUserFinancials(userId));
      }, [userId]);

      const handleAddRecord = (e) => {
        e.preventDefault();
        const data = db.get();
        const newRec = {
          id: "fin_" + Date.now(),
          userId,
          ...recData,
          amount: parseFloat(recData.amount) || 0
        };
        data.financials.push(newRec);
        db.set(data);
        setFinancials(db.getUserFinancials(userId));
        setShowModal(false);
      };

      const totalRevenue = financials.filter(f => f.type === "revenue").reduce((acc, f) => acc + f.amount, 0);
      const totalExpenses = financials.filter(f => f.type === "expense").reduce((acc, f) => acc + f.amount, 0);
      const netProfit = totalRevenue - totalExpenses;

      return (
        <div class="space-y-8">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900 font-heading">Analytics & Financials</h1>
              <p class="text-xs text-slate-500">Track crop expenses, farm revenues, and yield profitability</p>
            </div>
            <button
              onClick={() => setShowModal(true)}
              class="px-5 py-2.5 rounded-xl font-bold text-white bg-agri-800 hover:bg-agri-900 text-xs shadow-sm self-start sm:self-auto"
            >
              + Add Financial Record
            </button>
          </div>

          {/* Overview Stat Cards */}
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 text-center">
              <span class="text-xs text-emerald-700 font-bold uppercase">Total Revenue</span>
              <div class="text-2xl font-bold text-emerald-900 font-heading">₹{totalRevenue.toLocaleString()}</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 text-center">
              <span class="text-xs text-rose-700 font-bold uppercase">Total Expenses</span>
              <div class="text-2xl font-bold text-rose-900 font-heading">₹{totalExpenses.toLocaleString()}</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 text-center">
              <span class="text-xs text-slate-700 font-bold uppercase">Net Profit / Loss</span>
              <div class={`text-2xl font-bold font-heading ${netProfit >= 0 ? 'text-slate-900' : 'text-rose-600'}`}>
                ₹{netProfit.toLocaleString()}
              </div>
            </div>
          </div>

          {/* Record Table */}
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-xs space-y-4">
            <h3 class="font-bold text-slate-900 text-base font-heading">Financial Ledger</h3>
            {financials.length === 0 ? (
              <div class="text-center py-8 bg-slate-50 rounded-2xl border border-dashed text-xs text-slate-500">
                No financial records created yet. Add income or expenses to visualize analytics.
              </div>
            ) : (
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="border-b border-slate-200 bg-slate-50">
                      <th class="p-3 font-bold text-slate-700">Date</th>
                      <th class="p-3 font-bold text-slate-700">Type</th>
                      <th class="p-3 font-bold text-slate-700">Category</th>
                      <th class="p-3 font-bold text-slate-700">Amount</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    {financials.map(f => (
                      <tr key={f.id}>
                        <td class="p-3 text-slate-600">{f.date}</td>
                        <td class="p-3">
                          <span class={`px-2 py-0.5 rounded font-bold ${f.type === 'revenue' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                            {f.type}
                          </span>
                        </td>
                        <td class="p-3 text-slate-800 font-semibold">{f.category}</td>
                        <td class="p-3 font-bold text-slate-900">₹{f.amount}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* Modal */}
          {showModal && (
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50">
              <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4">
                <h4 class="font-bold text-lg font-heading">Add Financial Entry</h4>
                <form onSubmit={handleAddRecord} class="space-y-3 text-xs">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Entry Type</label>
                    <select class="w-full px-3 py-2 border rounded-xl" value={recData.type} onChange={e => setRecData({ ...recData, type: e.target.value })}>
                      <option value="expense">Expense</option>
                      <option value="revenue">Revenue</option>
                    </select>
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Category</label>
                    <input type="text" required class="w-full px-3 py-2 border rounded-xl" value={recData.category} onChange={e => setRecData({ ...recData, category: e.target.value })} />
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">Amount (₹)</label>
                    <input type="number" required class="w-full px-3 py-2 border rounded-xl" value={recData.amount} onChange={e => setRecData({ ...recData, amount: e.target.value })} />
                  </div>
                  <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowModal(false)} class="px-4 py-2 border rounded-xl">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-agri-800 text-white font-bold rounded-xl">Save Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ==========================================
    // 15. ALERTS & SETTINGS VIEWS
    // ==========================================
    const AlertsView = () => (
      <div class="space-y-6">
        <h1 class="text-2xl font-bold text-slate-900 font-heading">Farm Alerts</h1>
        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-3">
          <div class="p-4 bg-amber-50 rounded-2xl border border-amber-200 flex items-center justify-between text-xs">
            <div class="flex items-center gap-3">
              <i data-lucide="bell" class="w-5 h-5 text-amber-700"></i>
              <div>
                <div class="font-bold text-slate-900">Weather Notice</div>
                <div class="text-slate-600">Favorable temperature conditions across farm plots</div>
              </div>
            </div>
            <span class="text-slate-400">Today</span>
          </div>
        </div>
      </div>
    );

    const SettingsView = ({ user, farm, onLogout }) => (
      <div class="space-y-6 max-w-2xl">
        <h1 class="text-2xl font-bold text-slate-900 font-heading">Settings & Profile</h1>
        
        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-4">
          <h3 class="font-bold text-slate-900 text-base font-heading">Farmer Account</h3>
          <div class="text-xs space-y-2">
            <div><span class="text-slate-400">Name:</span> <span class="font-bold text-slate-800">{user?.name}</span></div>
            <div><span class="text-slate-400">Email:</span> <span class="font-bold text-slate-800">{user?.email}</span></div>
            <div><span class="text-slate-400">Phone:</span> <span class="font-bold text-slate-800">{user?.phone || 'N/A'}</span></div>
          </div>
        </div>

        <div class="bg-white p-6 rounded-3xl border border-slate-200 space-y-4">
          <h3 class="font-bold text-slate-900 text-base font-heading">Farm Information</h3>
          <div class="text-xs space-y-2">
            <div><span class="text-slate-400">Farm Name:</span> <span class="font-bold text-slate-800">{farm?.farmName}</span></div>
            <div><span class="text-slate-400">Area:</span> <span class="font-bold text-slate-800">{farm?.farmArea} {farm?.areaUnit}</span></div>
            <div><span class="text-slate-400">Location:</span> <span class="font-bold text-slate-800">{farm?.district}, {farm?.state}</span></div>
          </div>
        </div>

        <div class="pt-4 border-t border-slate-200">
          <button
            onClick={onLogout}
            class="px-6 py-3 rounded-xl font-bold text-rose-600 bg-rose-50 border border-rose-200 hover:bg-rose-100 transition-all text-xs"
          >
            Log Out of FarmGuard
          </button>
        </div>
      </div>
    );

    // ==========================================
    // 16. MAIN APP SHELL & ROUTER
    // ==========================================
    const App = () => {
      const [currentUser, setCurrentUser] = useState(null);
      const [userFarm, setUserFarm] = useState(null);
      const [userCrops, setUserCrops] = useState([]);
      const [view, setView] = useState("landing"); // landing, signup, login, setup, dashboard, crops, status, market, help, analytics, alerts, settings
      const [selectedCropIdForStatus, setSelectedCropIdForStatus] = useState(null);
      const [isAddCropOpen, setIsAddCropOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Initialize session on mount
      useEffect(() => {
        const u = db.getCurrentUser();
        if (u) {
          setCurrentUser(u);
          const f = db.getUserFarm(u.id);
          setUserFarm(f);
          setUserCrops(db.getUserCrops(u.id));
          if (!f) setView("setup");
          else setView("dashboard");
        }
      }, []);

      // Re-initialize Lucide Icons whenever view changes
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [view, userCrops, selectedCropIdForStatus]);

      const handleLoginSuccess = (user, needsSetup) => {
        setCurrentUser(user);
        const f = db.getUserFarm(user.id);
        setUserFarm(f);
        setUserCrops(db.getUserCrops(user.id));

        if (needsSetup) {
          setView("setup");
        } else {
          setView("dashboard");
        }
      };

      const handleFarmSetupComplete = (farm) => {
        setUserFarm(farm);
        setView("dashboard");
      };

      const handleAddCrop = (cropData) => {
        const data = db.get();
        const newCrop = {
          id: "crop_" + Date.now(),
          userId: currentUser.id,
          ...cropData,
          createdAt: new Date().toISOString()
        };
        data.crops.push(newCrop);
        db.set(data);

        const updated = db.getUserCrops(currentUser.id);
        setUserCrops(updated);
        setSelectedCropIdForStatus(newCrop.id);
      };

      const handleDeleteCrop = (cropId) => {
        if (!confirm("Are you sure you want to delete this crop record?")) return;
        const data = db.get();
        data.crops = data.crops.filter(c => c.id !== cropId);
        db.set(data);
        setUserCrops(db.getUserCrops(currentUser.id));
      };

      const handleLogout = () => {
        const data = db.get();
        data.session.currentUserId = null;
        db.set(data);
        setCurrentUser(null);
        setUserFarm(null);
        setUserCrops([]);
        setView("landing");
      };

      const handleSelectCropForStatus = (cropId) => {
        setSelectedCropIdForStatus(cropId);
        setView("status");
      };

      // Selected Crop Object
      const activeCropForStatus = useMemo(() => {
        if (selectedCropIdForStatus) {
          return userCrops.find(c => c.id === selectedCropIdForStatus) || userCrops[0] || null;
        }
        return userCrops[0] || null;
      }, [userCrops, selectedCropIdForStatus]);

      // Unauthenticated views
      if (view === "landing") return <LandingPage onNavigate={setView} />;
      if (view === "signup") return <AuthSignup onNavigate={setView} onLoginSuccess={handleLoginSuccess} />;
      if (view === "login") return <AuthLogin onNavigate={setView} onLoginSuccess={handleLoginSuccess} />;
      if (view === "setup") return <FarmProfileSetup user={currentUser} onComplete={handleFarmSetupComplete} />;

      // Main Authenticated Dashboard Layout
      const NAV_ITEMS = [
        { id: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
        { id: "crops", label: "My Crops", icon: "sprout" },
        { id: "status", label: "Crop Status", icon: "activity" },
        { id: "market", label: "Market & Crop Search", icon: "trending-up" },
        { id: "help", label: "Farmer Help", icon: "help-circle" },
        { id: "analytics", label: "Analytics", icon: "pie-chart" },
        { id: "alerts", label: "Alerts", icon: "bell" },
        { id: "settings", label: "Settings", icon: "settings" },
      ];

      return (
        <div class="min-h-screen bg-slate-50 flex">
          {/* Desktop Left Sidebar */}
          <aside class="hidden lg:flex w-64 bg-white border-r border-slate-200 flex-col justify-between p-6 shrink-0 sticky top-0 h-screen">
            <div class="space-y-6">
              <FarmGuardLogo size="md" />

              {/* Farm Badge */}
              <div class="p-3 bg-agri-50 rounded-2xl border border-agri-100 flex items-center gap-3">
                <div class="w-8 h-8 rounded-xl bg-agri-800 text-white flex items-center justify-center font-bold text-xs">
                  <i data-lucide="map-pin" class="w-4 h-4"></i>
                </div>
                <div class="truncate text-xs">
                  <div class="font-bold text-slate-900 truncate">{userFarm?.farmName || "My Farm"}</div>
                  <div class="text-slate-500 text-[10px]">{userFarm?.district || "Location"}</div>
                </div>
              </div>

              {/* Main Nav */}
              <nav class="space-y-1">
                {NAV_ITEMS.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    class={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-bold text-xs transition-all ${
                      view === item.id
                        ? "bg-agri-800 text-white shadow-sm"
                        : "text-slate-600 hover:bg-slate-100"
                    }`}
                  >
                    <i data-lucide={item.icon} class="w-4 h-4"></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* User Profile Footer */}
            <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
              <div class="truncate text-xs">
                <div class="font-bold text-slate-900 truncate">{currentUser.name}</div>
                <div class="text-slate-400 text-[10px] truncate">{currentUser.email}</div>
              </div>
              <button onClick={handleLogout} class="text-slate-400 hover:text-rose-600 p-1.5" title="Log out">
                <i data-lucide="log-out" class="w-4 h-4"></i>
              </button>
            </div>
          </aside>

          {/* Main Area */}
          <div class="flex-1 flex flex-col min-w-0">
            {/* Mobile Header */}
            <header class="lg:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
              <FarmGuardLogo size="sm" />
              <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} class="p-2 text-slate-700">
                <i data-lucide={mobileMenuOpen ? "x" : "menu"} class="w-6 h-6"></i>
              </button>
            </header>

            {/* Mobile Navigation Drawer */}
            {mobileMenuOpen && (
              <div class="lg:hidden bg-white border-b border-slate-200 px-4 py-4 space-y-2 shadow-lg">
                {NAV_ITEMS.map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setView(item.id); setMobileMenuOpen(false); }}
                    class={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-bold text-xs ${
                      view === item.id ? "bg-agri-800 text-white" : "text-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    <i data-lucide={item.icon} class="w-4 h-4"></i>
                    <span>{item.label}</span>
                  </button>
                ))}
              </div>
            )}

            {/* Page View Container */}
            <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
              {view === "dashboard" && (
                <DashboardView
                  farm={userFarm}
                  crops={userCrops}
                  onNavigate={setView}
                  onSelectCropForStatus={handleSelectCropForStatus}
                  onOpenAddCrop={() => setIsAddCropOpen(true)}
                />
              )}

              {view === "crops" && (
                <MyCropsView
                  crops={userCrops}
                  onSelectCropForStatus={handleSelectCropForStatus}
                  onDeleteCrop={handleDeleteCrop}
                  onOpenAddCrop={() => setIsAddCropOpen(true)}
                />
              )}

              {view === "status" && (
                <CropStatusView
                  crop={activeCropForStatus}
                  farm={userFarm}
                  userId={currentUser.id}
                  onOpenAddCrop={() => setIsAddCropOpen(true)}
                />
              )}

              {view === "market" && <MarketSearchView />}
              {view === "help" && <FarmerHelpView />}
              {view === "analytics" && <AnalyticsView userId={currentUser.id} crops={userCrops} />}
              {view === "alerts" && <AlertsView />}
              {view === "settings" && <SettingsView user={currentUser} farm={userFarm} onLogout={handleLogout} />}
            </main>
          </div>

          {/* Add Crop Global Modal */}
          <AddCropModal
            isOpen={isAddCropOpen}
            onClose={() => setIsAddCropOpen(false)}
            onAddCrop={handleAddCrop}
          />
        </div>
      );
    };

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
